<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edriz Ville - Resort Management System</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts@2.8.0/umd/Recharts.js"></script>
    <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, LineChart, Line, PieChart, Pie, Cell, ResponsiveContainer } = Recharts;
        const { Calendar, Users, DollarSign, TrendingUp, PlusCircle, Filter, Search, Edit3, Trash2, Eye } = lucide;

        const ResortDashboard = () => {
          // Start with empty data - user will add their own
          const [guests, setGuests] = useState([]);
          const [expenses, setExpenses] = useState([]);

          const [activeTab, setActiveTab] = useState('dashboard');
          const [showAddGuest, setShowAddGuest] = useState(false);
          const [showAddExpense, setShowAddExpense] = useState(false);
          const [searchTerm, setSearchTerm] = useState('');
          const [dateFilter, setDateFilter] = useState('');

          // New guest form state
          const [newGuest, setNewGuest] = useState({
            name: '', checkIn: '', checkOut: '', room: '', guests: 1, revenue: 0, source: 'B2C'
          });

          // New expense form state
          const [newExpense, setNewExpense] = useState({
            category: 'Maintenance', amount: 0, date: '', description: ''
          });

          // Calculate metrics
          const totalRevenue = guests.reduce((sum, guest) => sum + guest.revenue, 0);
          const totalExpenses = expenses.reduce((sum, expense) => sum + expense.amount, 0);
          const netProfit = totalRevenue - totalExpenses;
          const activeGuests = guests.filter(guest => guest.status === 'active').length;
          const totalRooms = 10; // You can adjust this number based on your villa capacity
          const occupancyRate = totalRooms > 0 ? Math.round((activeGuests / totalRooms) * 100) : 0;

          // Chart data - will be empty initially or show placeholder
          const revenueData = guests.length > 0 ? 
            guests.slice(-7).map((guest, index) => ({
              name: `Day ${index + 1}`,
              revenue: guest.revenue,
              expenses: expenses[index]?.amount || 0
            })) : 
            [
              { name: 'No Data', revenue: 0, expenses: 0 }
            ];

          // Expense categories for pie chart
          const expenseCategories = expenses.length > 0 ?
            expenses.reduce((acc, expense) => {
              const existing = acc.find(item => item.name === expense.category);
              if (existing) {
                existing.value += expense.amount;
              } else {
                acc.push({ 
                  name: expense.category, 
                  value: expense.amount,
                  color: ['#8884d8', '#82ca9d', '#ffc658', '#ff7c7c', '#8dd1e1'][acc.length % 5]
                });
              }
              return acc;
            }, []) :
            [{ name: 'No Data', value: 0, color: '#e5e7eb' }];

          // Add new guest
          const handleAddGuest = (e) => {
            e.preventDefault();
            if (!newGuest.name || !newGuest.checkIn || !newGuest.checkOut || !newGuest.room || !newGuest.revenue) {
              alert('Please fill in all required fields');
              return;
            }
            const guest = {
              id: Date.now(),
              ...newGuest,
              status: 'active',
              revenue: parseFloat(newGuest.revenue) || 0,
              guests: parseInt(newGuest.guests) || 1
            };
            setGuests(prevGuests => [...prevGuests, guest]);
            setNewGuest({ name: '', checkIn: '', checkOut: '', room: '', guests: 1, revenue: 0, source: 'B2C' });
            setShowAddGuest(false);
            alert('Guest added successfully!');
          };

          // Add new expense
          const handleAddExpense = (e) => {
            e.preventDefault();
            if (!newExpense.description || !newExpense.date || !newExpense.amount) {
              alert('Please fill in all required fields');
              return;
            }
            const expense = {
              id: Date.now(),
              ...newExpense,
              amount: parseFloat(newExpense.amount) || 0
            };
            setExpenses(prevExpenses => [...prevExpenses, expense]);
            setNewExpense({ category: 'Maintenance', amount: 0, date: '', description: '' });
            setShowAddExpense(false);
            alert('Expense added successfully!');
          };

          // Filter guests based on search and date
          const filteredGuests = guests.filter(guest => {
            const matchesSearch = guest.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                 guest.room.toLowerCase().includes(searchTerm.toLowerCase());
            const matchesDate = !dateFilter || guest.checkIn >= dateFilter;
            return matchesSearch && matchesDate;
          });

          // Delete guest function
          const handleDeleteGuest = (guestId) => {
            if (window.confirm('Are you sure you want to delete this guest?')) {
              setGuests(guests.filter(guest => guest.id !== guestId));
            }
          };

          // Delete expense function
          const handleDeleteExpense = (expenseId) => {
            if (window.confirm('Are you sure you want to delete this expense?')) {
              setExpenses(expenses.filter(expense => expense.id !== expenseId));
            }
          };

          return (
            <div className="min-h-screen bg-gray-50">
              {/* Header */}
              <div className="bg-white shadow-sm border-b">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex justify-between items-center py-4">
                    <div>
                      <h1 className="text-2xl font-bold text-gray-900">Edriz Ville</h1>
                      <p className="text-gray-600">Artistic Home</p>
                    </div>
                    <div className="text-sm text-gray-500 font-medium">
                      Make Idrees Rich :)
                    </div>
                  </div>
                </div>
              </div>

              {/* Navigation Tabs */}
              <div className="bg-white border-b">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex space-x-8">
                    {['dashboard', 'guests', 'expenses', 'analytics'].map((tab) => (
                      <button
                        key={tab}
                        onClick={() => setActiveTab(tab)}
                        className={`py-4 px-2 border-b-2 font-medium text-sm capitalize ${
                          activeTab === tab
                            ? 'border-blue-500 text-blue-600'
                            : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                        }`}
                      >
                        {tab}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                {activeTab === 'dashboard' && (
                  <div>
                    {/* Key Metrics */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                      <div className="bg-white rounded-lg shadow p-6">
                        <div className="flex items-center">
                          <div className="p-2 bg-blue-100 rounded-lg">
                            <DollarSign className="w-6 h-6 text-blue-600" />
                          </div>
                          <div className="ml-4">
                            <p className="text-sm font-medium text-gray-600">Total Revenue</p>
                            <p className="text-2xl font-bold text-gray-900">₹{totalRevenue.toLocaleString('en-IN')}</p>
                          </div>
                        </div>
                      </div>

                      <div className="bg-white rounded-lg shadow p-6">
                        <div className="flex items-center">
                          <div className="p-2 bg-red-100 rounded-lg">
                            <TrendingUp className="w-6 h-6 text-red-600" />
                          </div>
                          <div className="ml-4">
                            <p className="text-sm font-medium text-gray-600">Total Expenses</p>
                            <p className="text-2xl font-bold text-gray-900">₹{totalExpenses.toLocaleString('en-IN')}</p>
                          </div>
                        </div>
                      </div>

                      <div className="bg-white rounded-lg shadow p-6">
                        <div className="flex items-center">
                          <div className="p-2 bg-green-100 rounded-lg">
                            <DollarSign className="w-6 h-6 text-green-600" />
                          </div>
                          <div className="ml-4">
                            <p className="text-sm font-medium text-gray-600">Net Profit</p>
                            <p className="text-2xl font-bold text-gray-900">₹{netProfit.toLocaleString('en-IN')}</p>
                          </div>
                        </div>
                      </div>

                      <div className="bg-white rounded-lg shadow p-6">
                        <div className="flex items-center">
                          <div className="p-2 bg-purple-100 rounded-lg">
                            <Users className="w-6 h-6 text-purple-600" />
                          </div>
                          <div className="ml-4">
                            <p className="text-sm font-medium text-gray-600">Occupancy Rate</p>
                            <p className="text-2xl font-bold text-gray-900">{occupancyRate}%</p>
                          </div>
                        </div>
                      </div>
                    </div>

                    {guests.length === 0 && expenses.length === 0 ? (
                      <div className="bg-white rounded-lg shadow p-12 text-center">
                        <div className="text-gray-400 mb-4">
                          <Users className="w-16 h-16 mx-auto" />
                        </div>
                        <h3 className="text-xl font-semibold text-gray-900 mb-2">Welcome to Edriz Ville Management System!</h3>
                        <p className="text-gray-600 mb-6">Start by adding your first guest or expense to see your dashboard come to life.</p>
                        <div className="flex justify-center space-x-4">
                          <button
                            onClick={() => setActiveTab('guests')}
                            className="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700"
                          >
                            Add First Guest
                          </button>
                          <button
                            onClick={() => setActiveTab('expenses')}
                            className="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700"
                          >
                            Add First Expense
                          </button>
                        </div>
                      </div>
                    ) : (
                      <>
                        {/* Charts */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
                          <div className="bg-white rounded-lg shadow p-6">
                            <h3 className="text-lg font-semibold text-gray-900 mb-4">Revenue vs Expenses</h3>
                            <ResponsiveContainer width="100%" height={250}>
                              <LineChart data={revenueData}>
                                <CartesianGrid strokeDasharray="3 3" />
                                <XAxis dataKey="name" />
                                <YAxis />
                                <Tooltip formatter={(value) => [`₹${value.toLocaleString('en-IN')}`, '']} />
                                <Legend />
                                <Line type="monotone" dataKey="revenue" stroke="#3B82F6" strokeWidth={3} name="Revenue" />
                                <Line type="monotone" dataKey="expenses" stroke="#EF4444" strokeWidth={3} name="Expenses" />
                              </LineChart>
                            </ResponsiveContainer>
                          </div>

                          <div className="bg-white rounded-lg shadow p-6">
                            <h3 className="text-lg font-semibold text-gray-900 mb-4">Expense Categories</h3>
                            <ResponsiveContainer width="100%" height={250}>
                              <PieChart>
                                <Pie
                                  data={expenseCategories}
                                  cx="50%"
                                  cy="50%"
                                  outerRadius={80}
                                  fill="#8884d8"
                                  dataKey="value"
                                  label={({ name, percent }) => expenses.length > 0 ? `${name} ${(percent * 100).toFixed(0)}%` : name}
                                >
                                  {expenseCategories.map((entry, index) => (
                                    <Cell key={`cell-${index}`} fill={entry.color} />
                                  ))}
                                </Pie>
                                <Tooltip formatter={(value) => [`₹${value.toLocaleString('en-IN')}`, '']} />
                              </PieChart>
                            </ResponsiveContainer>
                          </div>

                          <div className="bg-white rounded-lg shadow p-6">
                            <h3 className="text-lg font-semibold text-gray-900 mb-4">B2B vs B2C Revenue</h3>
                            <ResponsiveContainer width="100%" height={250}>
                              <BarChart data={[
                                { name: 'B2B', value: guests.filter(g => g.source === 'B2B').reduce((sum, g) => sum + g.revenue, 0), fill: '#3B82F6' },
                                { name: 'B2C', value: guests.filter(g => g.source === 'B2C').reduce((sum, g) => sum + g.revenue, 0), fill: '#8B5CF6' }
                              ]}>
                                <CartesianGrid strokeDasharray="3 3" />
                                <XAxis dataKey="name" />
                                <YAxis />
                                <Tooltip formatter={(value) => [`₹${value.toLocaleString('en-IN')}`, '']} />
                                <Bar dataKey="value" />
                              </BarChart>
                            </ResponsiveContainer>
                          </div>
                        </div>

                        {/* B2B vs B2C Metrics */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                          <div className="bg-white rounded-lg shadow p-6">
                            <div className="flex items-center">
                              <div className="p-2 bg-blue-100 rounded-lg">
                                <Users className="w-6 h-6 text-blue-600" />
                              </div>
                              <div className="ml-4">
                                <p className="text-sm font-medium text-gray-600">B2B Guests</p>
                                <p className="text-2xl font-bold text-gray-900">{guests.filter(g => g.source === 'B2B').length}</p>
                              </div>
                            </div>
                          </div>

                          <div className="bg-white rounded-lg shadow p-6">
                            <div className="flex items-center">
                              <div className="p-2 bg-purple-100 rounded-lg">
                                <Users className="w-6 h-6 text-purple-600" />
                              </div>
                              <div className="ml-4">
                                <p className="text-sm font-medium text-gray-600">B2C Guests</p>
                                <p className="text-2xl font-bold text-gray-900">{guests.filter(g => g.source === 'B2C').length}</p>
                              </div>
                            </div>
                          </div>

                          <div className="bg-white rounded-lg shadow p-6">
                            <div className="flex items-center">
                              <div className="p-2 bg-blue-100 rounded-lg">
                                <DollarSign className="w-6 h-6 text-blue-600" />
                              </div>
                              <div className="ml-4">
                                <p className="text-sm font-medium text-gray-600">B2B Revenue</p>
                                <p className="text-2xl font-bold text-gray-900">₹{guests.filter(g => g.source === 'B2B').reduce((sum, g) => sum + g.revenue, 0).toLocaleString('en-IN')}</p>
                              </div>
                            </div>
                          </div>

                          <div className="bg-white rounded-lg shadow p-6">
                            <div className="flex items-center">
                              <div className="p-2 bg-purple-100 rounded-lg">
                                <DollarSign className="w-6 h-6 text-purple-600" />
                              </div>
                              <div className="ml-4">
                                <p className="text-sm font-medium text-gray-600">B2C Revenue</p>
                                <p className="text-2xl font-bold text-gray-900">₹{guests.filter(g => g.source === 'B2C').reduce((sum, g) => sum + g.revenue, 0).toLocaleString('en-IN')}</p>
                              </div>
                            </div>
                          </div>
                        </div>
                      </>
                    )}
                  </div>
                )}

                {activeTab === 'guests' && (
                  <div>
                    {/* Search, Filter and Add Guest */}
                    <div className="bg-white rounded-lg shadow p-6 mb-6">
                      <div className="flex flex-col lg:flex-row gap-4 items-start lg:items-center justify-between">
                        <div className="flex flex-col sm:flex-row gap-4 flex-1">
                          <div className="flex-1">
                            <div className="relative">
                              <Search className="w-5 h-5 absolute left-3 top-3 text-gray-400" />
                              <input
                                type="text"
                                placeholder="Search guests by name or room..."
                                className="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                              />
                            </div>
                          </div>
                          <div>
                            <input
                              type="date"
                              className="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                              value={dateFilter}
                              onChange={(e) => setDateFilter(e.target.value)}
                            />
                          </div>
                        </div>
                        <div>
                          <button
                            onClick={() => setShowAddGuest(true)}
                            className="bg-blue-600 text-white px-6 py-2 rounded-lg flex items-center space-x-2 hover:bg-blue-700 transition-colors"
                          >
                            <PlusCircle className="w-4 h-4" />
                            <span>Add New Guest</span>
                          </button>
                        </div>
                      </div>
                    </div>

                    {/* Guest List */}
                    <div className="bg-white rounded-lg shadow overflow-hidden">
                      <div className="px-6 py-4 border-b border-gray-200">
                        <h3 className="text-lg font-semibold text-gray-900">Guest Management</h3>
                      </div>
                      {guests.length === 0 ? (
                        <div className="p-12 text-center">
                          <Users className="w-16 h-16 mx-auto text-gray-300 mb-4" />
                          <h3 className="text-lg font-semibold text-gray-900 mb-2">No Guests Yet</h3>
                          <p className="text-gray-600 mb-4">Start by adding your first guest booking</p>
                          <button
                            onClick={() => setShowAddGuest(true)}
                            className="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700"
                          >
                            Add First Guest
                          </button>
                        </div>
                      ) : (
                        <div className="overflow-x-auto">
                          <table className="min-w-full divide-y divide-gray-200">
                            <thead className="bg-gray-50">
                              <tr>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Guest</th>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Room Type</th>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Check In</th>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Check Out</th>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Source</th>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Revenue</th>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                              </tr>
                            </thead>
                            <tbody className="bg-white divide-y divide-gray-200">
                              {filteredGuests.map((guest) => (
                                <tr key={guest.id} className="hover:bg-gray-50">
                                  <td className="px-6 py-4 whitespace-nowrap">
                                    <div>
                                      <div className="text-sm font-medium text-gray-900">{guest.name}</div>
                                      <div className="text-sm text-gray-500">{guest.guests} guest(s)</div>
                                    </div>
                                  </td>
                                  <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{guest.room}</td>
                                  <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{guest.checkIn}</td>
                                  <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{guest.checkOut}</td>
                                  <td className="px-6 py-4 whitespace-nowrap">
                                    <span className={`px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${
                                      guest.source === 'B2B' 
                                        ? 'bg-blue-100 text-blue-800' 
                                        : 'bg-purple-100 text-purple-800'
                                    }`}>
                                      {guest.source}
                                    </span>
                                  </td>
                                  <td className="px-6 py-4 whitespace-nowrap">
                                    <span className={`px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${
                                      guest.status === 'active' 
                                        ? 'bg-green-100 text-green-800' 
                                        : 'bg-gray-100 text-gray-800'
                                    }`}>
                                      {guest.status}
                                    </span>
                                  </td>
                                  <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-900">₹{guest.revenue.toLocaleString('en-IN')}</td>
                                  <td className="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                    <div className="flex space-x-2">
                                      <button 
                                        className="text-green-600 hover:text-green-900"
                                        onClick={() => {
                                          alert('Edit functionality coming soon!');
                                        }}
                                      >
                                        <Edit3 className="w-4 h-4" />
                                      </button>
                                      <button 
                                        className="text-red-600 hover:text-red-900"
                                        onClick={() => handleDeleteGuest(guest.id)}
                                      >
                                        <Trash2 className="w-4 h-4" />
                                      </button>
                                    </div>
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {activeTab === 'expenses' && (
                  <div>
                    {/* Add Expense Button */}
                    <div className="mb-6 flex justify-between items-center">
                      <div>
                        <h2 className="text-xl font-semibold text-gray-900">Expense Management</h2>
                        <p className="text-gray-600">Track and manage all resort expenses</p>
                      </div>
                      <button
                        onClick={() => setShowAddExpense(true)}
                        className="bg-green-600 text-white px-6 py-2 rounded-lg flex items-center space-x-2 hover:bg-green-700 transition-colors"
                      >
                        <PlusCircle className="w-4 h-4" />
                        <span>Add New Expense</span>
                      </button>
                    </div>

                    {/* Expenses List */}
                    <div className="bg-white rounded-lg shadow overflow-hidden">
                      <div className="px-6 py-4 border-b border-gray-200">
                        <h3 className="text-lg font-semibold text-gray-900">Expense Management</h3>
                      </div>
                      {expenses.length === 0 ? (
                        <div className="p-12 text-center">
                          <DollarSign className="w-16 h-16 mx-auto text-gray-300 mb-4" />
                          <h3 className="text-lg font-semibold text-gray-900 mb-2">No Expenses Yet</h3>
                          <p className="text-gray-600 mb-4">Start by adding your first expense</p>
                          <button
                            onClick={() => setShowAddExpense(true)}
                            className="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700"
                          >
                            Add First Expense
                          </button>
                        </div>
                      ) : (
                        <div className="overflow-x-auto">
                          <table className="min-w-full divide-y divide-gray-200">
                            <thead className="bg-gray-50">
                              <tr>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Category</th>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Amount</th>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                              </tr>
                            </thead>
                            <tbody className="bg-white divide-y divide-gray-200">
                              {expenses.map((expense) => (
                                <tr key={expense.id} className="hover:bg-gray-50">
                                  <td className="px-6 py-4 whitespace-nowrap">
                                    <span className="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">
                                      {expense.category}
                                    </span>
                                  </td>
